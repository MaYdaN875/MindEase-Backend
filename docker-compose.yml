version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mindease-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mindease
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mindease"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file:
      - .env
    container_name: mindease-app
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mindease?schema=public
      JWT_SECRET: super-secret-mindease-jwt-key-change-in-production
      JWT_EXPIRES_IN: 7d
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./storage:/usr/src/app/storage
    # Schema changes are an explicit deployment step, never implicit data loss.
    command: node dist/server.js

volumes:
  postgres_data:
